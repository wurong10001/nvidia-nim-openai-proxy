name = "nvidia-nim-openai-proxy"
# account_id set via CF_ACCOUNT_ID env variable in CI
# zone_id omitted; specify via "route = \"YOUR_DOMAIN/*\"" when deploying to production
main = "src/index.ts"
compatibility_date = "2026-10-13"
# route = "YOUR_DOMAIN/*" # set after domain configured in Cloudflare
# workers_dev = false  # uncomment if you want production route

[observability]
enabled = true

# Admin panel KV bindings. Create the two namespaces in the Cloudflare
# dashboard (Workers & Pages -> KV -> Create namespace), then uncomment
# the blocks below and fill in the real IDs. Until then, /op/admin and
# /op/api/* return 503; the proxy itself is unaffected.
# [[kv_namespaces]]
# binding = "ADMIN_KV"
# id = ""
# preview_id = ""

# [[kv_namespaces]]
# binding = "ADMIN_TEMP_KV"
# id = ""
# preview_id = ""
